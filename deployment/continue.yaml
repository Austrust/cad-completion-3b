name: CAD completion v1 Q4
version: 1.0.0
schema: v1
models:
  - name: CAD v1 Q4 autocomplete
    provider: llama.cpp
    model: qwen2.5-coder-3b
    apiBase: http://127.0.0.1:18031
    roles:
      - autocomplete
    defaultCompletionOptions:
      contextLength: 2048
      maxTokens: 128
      temperature: 0
    requestOptions:
      extraBodyProperties:
        repeat_penalty: 1
        cache_prompt: false
    autocompleteOptions:
      maxPromptTokens: 1250
      debounceDelay: 250
      onlyMyCode: true
    promptTemplates:
      autocomplete: '<|fim_prefix|>{{{prefix}}}<|fim_suffix|>{{{suffix}}}<|fim_middle|>'
